name: bandeja-telegram

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inbox
      POSTGRES_USER: inbox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Completa POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inbox -d inbox"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-bandeja}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Completa RABBITMQ_PASSWORD en .env}
    volumes:
      - rabbit_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/Bandeja.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Inbox: Host=postgres;Port=5432;Database=inbox;Username=inbox;Password=${POSTGRES_PASSWORD}
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:?Completa TELEGRAM_BOT_TOKEN en .env}
      Telegram__WebhookSecret: ${TELEGRAM_WEBHOOK_SECRET:?Completa TELEGRAM_WEBHOOK_SECRET en .env}
      Telegram__PublicBaseUrl: https://${NGROK_DOMAIN:?Completa NGROK_DOMAIN en .env}
      RabbitMq__Uri: amqp://${RABBITMQ_USER:-bandeja}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      Frontend__Origin: http://localhost:${WEB_PORT:-8088}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      - api
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:3
    command: ["http", "--domain=${NGROK_DOMAIN:?Completa NGROK_DOMAIN en .env}", "api:8080"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Completa NGROK_AUTHTOKEN en .env}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  rabbit_data:
